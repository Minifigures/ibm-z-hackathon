# Ibm Z Hackathon Workflow Merge Feature Branch With Conflict Resolution

## Action

Follow the merge-feature-branch-with-conflict-resolution workflow:
1. Merge remote-tracking branch into target branch.
2. Resolve conflicts in overlapping files (e.g., backend/app/main.py, backend/app/data/diseases.json, frontend/lib/api.ts).
3. Integrate or reconcile test changes (backend/tests/test_endpoints.py, frontend/tests/*.test.tsx).
4. Verify all tests pass after merge.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: backend/app/main.py, backend/app/data/diseases.json, backend/app/data/disease_corpus.json

