# Ibm Z Hackathon Workflow Add Or Update Disease Preset And Validation

## Action

Follow the add-or-update-disease-preset-and-validation workflow:
1. Edit or add entry in backend/app/data/diseases.json with new disease parameters.
2. Update backend/app/data/countries.json if new origin countries are needed.
3. Update backend/app/data/disease_corpus.json for LLM lookup and aliases.
4. Modify backend/app/disease_lookup.py to handle new disease or origin logic.
5. Add or update validation logic in backend/backtest/validate.py and backend/backtest/validate_ensemble.py.
6. Update backend/app/main.py to expose new disease in API endpoints.
7. Update or add tests in backend/tests/test_endpoints.py and/or backend/tests/test_disease_lookup.py.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: backend/app/data/diseases.json, backend/app/data/countries.json, backend/app/data/disease_corpus.json

