name: Deploy to VSI

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vsi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          WATSONX_APIKEY: ${{ secrets.WATSONX_APIKEY }}
          WATSONX_PROJECT_ID: ${{ secrets.WATSONX_PROJECT_ID }}
          WATSONX_URL: ${{ secrets.WATSONX_URL }}
        run: |
          # The remote heredoc is single-quoted (literal), but we still need
          # the watsonx secrets to be readable by the remote bash. We pass
          # them via the SSH command string, which expands locally; on the
          # remote side they are normal environment variables that our
          # remote script reads when writing /opt/disease-outflow/backend/.env.
          ssh -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "WATSONX_APIKEY='$WATSONX_APIKEY' WATSONX_PROJECT_ID='$WATSONX_PROJECT_ID' WATSONX_URL='$WATSONX_URL' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_DIR=/opt/disease-outflow
          cd "$APP_DIR"

          before_req=$(sha1sum backend/requirements.txt | awk '{print $1}')
          before_pkg=$(sha1sum frontend/package-lock.json | awk '{print $1}')

          git fetch --depth=1 origin main
          git reset --hard origin/main

          after_req=$(sha1sum backend/requirements.txt | awk '{print $1}')
          after_pkg=$(sha1sum frontend/package-lock.json | awk '{print $1}')

          if [ "$before_req" != "$after_req" ]; then
            echo "==> backend deps changed, reinstalling"
            backend/.venv/bin/pip install -r backend/requirements.txt --quiet
          fi

          if [ "$before_pkg" != "$after_pkg" ]; then
            echo "==> frontend deps changed, npm ci"
            (cd frontend && npm ci --no-audit --no-fund --silent)
          fi

          echo "==> rebuild frontend"
          # NEXT_PUBLIC_* must be set at build time -- Next bakes them into
          # the client bundle. nginx on this VSI proxies /api/* to FastAPI,
          # so the frontend should call the same origin under /api.
          (cd frontend && NEXT_PUBLIC_API_BASE=/api npm run build)

          echo "==> write backend secrets to backend/.env"
          # backend/app/main.py calls load_dotenv() at import time, so this
          # file is read by the FastAPI process when systemd restarts it.
          # Variables came in via the SSH command line (see workflow yaml);
          # we use printf instead of a heredoc because the YAML run block
          # forces leading whitespace and a quoted heredoc terminator must
          # sit at column 0 to close.
          umask 077
          {
            printf 'WATSONX_APIKEY=%s\n'     "${WATSONX_APIKEY:-}"
            printf 'WATSONX_PROJECT_ID=%s\n' "${WATSONX_PROJECT_ID:-}"
            printf 'WATSONX_URL=%s\n'        "${WATSONX_URL:-}"
          } > backend/.env
          chmod 600 backend/.env

          echo "==> restart services"
          sudo /bin/systemctl reset-failed disease-outflow-backend.service disease-outflow-frontend.service 2>/dev/null || true
          sudo /bin/systemctl restart disease-outflow-backend.service
          sudo /bin/systemctl restart disease-outflow-frontend.service
          REMOTE

      - name: Health check (from runner, public)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -e
          ok_back=0; ok_front=0
          for i in $(seq 1 30); do
            if [ "$ok_back" -eq 0 ]  && curl -fsS --max-time 5 "http://${DEPLOY_HOST}/api/health" >/dev/null; then ok_back=1; fi
            if [ "$ok_front" -eq 0 ] && curl -fsS --max-time 5 -o /dev/null "http://${DEPLOY_HOST}/";        then ok_front=1; fi
            if [ "$ok_back" -eq 1 ] && [ "$ok_front" -eq 1 ]; then break; fi
            sleep 2
          done
          if [ "$ok_back" -ne 1 ]; then echo "::error::backend /api/health did not become healthy"; fi
          if [ "$ok_front" -ne 1 ]; then echo "::error::frontend / did not become reachable"; fi
          [ "$ok_back" -eq 1 ] && [ "$ok_front" -eq 1 ]
          echo "OK"
