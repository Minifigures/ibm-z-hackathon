name: Deploy to Code Engine

# Replaces the old "Deploy to VSI" workflow. The VSI was torn down on
# 2026-05-15; the live demo now runs on IBM Cloud Code Engine
# (scale-to-zero, free tier) with the custom domain
# https://pandexis.marcoayuste.com pointing at the frontend app.
#
# Strategy: we let Code Engine build the images itself from this repo
# (`--build-source`), instead of building locally and pushing to IBM
# Container Registry. That keeps us off ICR entirely (no namespace, no
# Docker registry plumbing, no pull-secret), and the Code Engine
# build-runs are covered by the same free monthly allowance as runtime.
#
# Required GitHub repo secret:
#   IBMCLOUD_API_KEY   IAM API key with access to the `pandexis` project
#
# Optional GitHub repo variables (defaults below match the live setup):
#   IBMCLOUD_REGION         default us-south
#   IBMCLOUD_RESOURCE_GROUP default Default
#   CE_PROJECT              default pandexis

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to redeploy'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - backend
          - frontend

concurrency:
  group: deploy-code-engine
  cancel-in-progress: false

env:
  IBMCLOUD_REGION: ${{ vars.IBMCLOUD_REGION || 'us-south' }}
  IBMCLOUD_RESOURCE_GROUP: ${{ vars.IBMCLOUD_RESOURCE_GROUP || 'Default' }}
  CE_PROJECT: ${{ vars.CE_PROJECT || 'pandexis' }}
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install IBM Cloud CLI + code-engine plugin
        run: |
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
          ibmcloud --version
          ibmcloud plugin install code-engine -f
          ibmcloud config --check-version=false

      - name: Login + select Code Engine project
        env:
          IBMCLOUD_API_KEY: ${{ secrets.IBMCLOUD_API_KEY }}
        run: |
          ibmcloud login --apikey "$IBMCLOUD_API_KEY" \
            -r "$IBMCLOUD_REGION" -g "$IBMCLOUD_RESOURCE_GROUP"
          ibmcloud ce project select --name "$CE_PROJECT"

      - name: Resolve which app(s) to redeploy
        id: which
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # On push: rebuild any app whose directory changed in the diff.
          # On manual dispatch: honour the `app` input.
          backend=0
          frontend=0
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.app }}" in
              both)     backend=1; frontend=1 ;;
              backend)  backend=1; frontend=0 ;;
              frontend) backend=0; frontend=1 ;;
            esac
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            # First push / force-push from nothing -> rebuild both.
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              backend=1; frontend=1
            else
              # We don't checkout the repo, so use the compare API to list changed files.
              changed=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/compare/$base...$head" \
                | grep -oE '"filename":[[:space:]]*"[^"]+"' \
                | sed 's/.*"\(.*\)".*/\1/')
              echo "$changed" | grep -q '^backend/'  && backend=1
              echo "$changed" | grep -q '^frontend/' && frontend=1
              # Workflow self-change retests both (safer default).
              if echo "$changed" | grep -q '^\.github/workflows/deploy\.yml$'; then
                backend=1; frontend=1
              fi
            fi
          fi
          echo "backend=$backend"   >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Will redeploy: backend=$backend frontend=$frontend"

      - name: Prune ICR before build (free space, keep currently-deployed image)
        # IBM Container Registry Lite tier caps storage at 0.5 GB. Both
        # of our images together (backend ~107 MB + frontend ~242 MB +
        # layer overhead) push us right against that cap, so a fresh
        # buildrun has nowhere to push the new layers. We run this BEFORE
        # the build steps: for each app, we look up the image tag the
        # currently-Ready revision references, delete every OTHER tag in
        # the ce-- namespace, and report the post-prune quota so the run
        # log explains the storage state. Currently-deployed images are
        # preserved so running pods can keep pulling on cold start.
        run: |
          set +e
          ibmcloud plugin install container-registry -f >/dev/null 2>&1
          ibmcloud cr region-set "$IBMCLOUD_REGION" >/dev/null 2>&1
          NS=$(ibmcloud cr namespaces 2>/dev/null | awk 'NR>3 && $1 ~ /^ce--/ {print $1; exit}')
          if [ -z "$NS" ]; then echo "no ce-- namespace found, skip"; exit 0; fi
          echo "namespace: $NS"
          for app in backend frontend; do
            live=$(ibmcloud ce app get --name "$app" --output jsonpath='{.status.latestReadyRevision}' 2>/dev/null)
            live_image=$(ibmcloud ce revision get --name "$live" --output jsonpath='{.spec.containers[0].image}' 2>/dev/null)
            live_tag="${live_image##*:}"
            echo "[$app] live tag (kept): $live_tag"
            ibmcloud cr images --restrict "$NS/app-$app" --format '{{.Tag}}' 2>/dev/null \
              | grep -v "^$live_tag$" \
              | while read t; do
                  [ -z "$t" ] && continue
                  echo "  rm $NS/app-$app:$t"
                  ibmcloud cr image-rm "us.icr.io/$NS/app-$app:$t" >/dev/null 2>&1
                done
          done
          echo "ICR quota after prune:"
          ibmcloud cr quota 2>&1 | grep -E 'Limit|Storage' || true

      - name: Rebuild + roll backend
        if: steps.which.outputs.backend == '1'
        run: |
          ibmcloud ce app update \
            --name backend \
            --build-source "$REPO_URL" \
            --build-context-dir backend \
            --build-dockerfile Dockerfile \
            --wait-timeout 600

      - name: Rebuild + roll frontend
        if: steps.which.outputs.frontend == '1'
        run: |
          ibmcloud ce app update \
            --name frontend \
            --build-source "$REPO_URL" \
            --build-context-dir frontend \
            --build-dockerfile Dockerfile \
            --wait-timeout 600

      - name: Prune ICR after build (delete the now-stale previous image)
        if: always()
        # After a successful build+rollout, the OLD image (still in ICR
        # because we wanted to preserve it during the build window) can
        # be safely removed. Same logic as the pre-build prune, but the
        # "live tag" has now moved to the freshly built image.
        run: |
          set +e
          NS=$(ibmcloud cr namespaces 2>/dev/null | awk 'NR>3 && $1 ~ /^ce--/ {print $1; exit}')
          if [ -z "$NS" ]; then exit 0; fi
          for app in backend frontend; do
            live=$(ibmcloud ce app get --name "$app" --output jsonpath='{.status.latestReadyRevision}' 2>/dev/null)
            live_image=$(ibmcloud ce revision get --name "$live" --output jsonpath='{.spec.containers[0].image}' 2>/dev/null)
            live_tag="${live_image##*:}"
            ibmcloud cr images --restrict "$NS/app-$app" --format '{{.Tag}}' 2>/dev/null \
              | grep -v "^$live_tag$" \
              | while read t; do
                  [ -z "$t" ] && continue
                  ibmcloud cr image-rm "us.icr.io/$NS/app-$app:$t" >/dev/null 2>&1
                done
          done
          echo "ICR quota after post-rollout prune:"
          ibmcloud cr quota 2>&1 | grep -E 'Limit|Storage' || true

      - name: Smoke test
        run: |
          BACKEND_URL=$(ibmcloud ce app get --name backend  --output url)
          FRONTEND_URL=$(ibmcloud ce app get --name frontend --output url)
          echo "backend  : $BACKEND_URL"
          echo "frontend : $FRONTEND_URL"
          echo "custom   : https://pandexis.marcoayuste.com (Cloudflare CNAME)"
          fail=0
          # Cold start can be ~5-10s for Next.js; retry a few times.
          for app in backend frontend; do
            if [ "$app" = "backend" ]; then url="$BACKEND_URL/health"; else url="$FRONTEND_URL/"; fi
            code=000
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url" || echo 000)
              echo "[$app try $i] $url -> $code"
              [ "$code" = "200" ] && break
              sleep 10
            done
            [ "$code" = "200" ] || fail=1
          done
          # Custom domain probe is soft (DNS+CE+cert all have to line up).
          dom_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://pandexis.marcoayuste.com/ || echo 000)
          echo "[custom] https://pandexis.marcoayuste.com -> $dom_code"
          [ "$dom_code" = "200" ] || echo "  (custom domain non-200 is a soft warning, not a build failure)"
          exit $fail
