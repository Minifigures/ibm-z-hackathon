name: Deploy to VSI

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vsi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_DIR=/opt/disease-outflow
          cd "$APP_DIR"

          before_req=$(sha1sum backend/requirements.txt | awk '{print $1}')
          before_pkg=$(sha1sum frontend/package-lock.json | awk '{print $1}')

          git fetch --depth=1 origin main
          git reset --hard origin/main

          after_req=$(sha1sum backend/requirements.txt | awk '{print $1}')
          after_pkg=$(sha1sum frontend/package-lock.json | awk '{print $1}')

          if [ "$before_req" != "$after_req" ]; then
            echo "==> backend deps changed, reinstalling"
            backend/.venv/bin/pip install -r backend/requirements.txt --quiet
          fi

          if [ "$before_pkg" != "$after_pkg" ]; then
            echo "==> frontend deps changed, npm ci"
            (cd frontend && npm ci --no-audit --no-fund --silent)
          fi

          echo "==> rebuild frontend"
          (cd frontend && npm run build)

          echo "==> restart services"
          sudo /bin/systemctl restart disease-outflow-backend.service
          sudo /bin/systemctl restart disease-outflow-frontend.service

          echo "==> health (retry up to 60s)"
          ok_back=0; ok_front=0
          for i in $(seq 1 30); do
            if [ "$ok_back" -eq 0 ]  && curl -fsS --max-time 5 http://127.0.0.1:8000/health >/dev/null 2>&1; then ok_back=1; fi
            if [ "$ok_front" -eq 0 ] && curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:3000/   2>/dev/null; then ok_front=1; fi
            if [ "$ok_back" -eq 1 ] && [ "$ok_front" -eq 1 ]; then break; fi
            sleep 2
          done
          [ "$ok_back" -eq 1 ]  || { echo "backend health failed";  journalctl -u disease-outflow-backend  -n 40 --no-pager || true; exit 1; }
          [ "$ok_front" -eq 1 ] || { echo "frontend not serving";   journalctl -u disease-outflow-frontend -n 40 --no-pager || true; exit 1; }
          echo "OK"
          REMOTE
